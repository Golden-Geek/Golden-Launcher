name: Official Chataigne smoke tests

on: workflow_dispatch

permissions:
  contents: read

env:
  CARGO_PROFILE_TEST_DEBUG: "0"
  GOLDEN_DISPOSABLE_SMOKE: "1"

jobs:
  chataigne:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows install, update, launch
            runner: windows-2025
          - name: Linux install, update, launch
            runner: ubuntu-22.04
          - name: macOS Intel install, update, launch
            runner: macos-15-intel
          - name: macOS Apple Silicon install, update, launch
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - name: Install Linux libraries and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb xauth libcurl4 libgcrypt20 libsystemd0 libjack-jackd2-0 libpipewire-0.3-0 libpulse0 libgl1-mesa-dri
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: publisher-smoke
      - name: Build frontend assets
        run: |
          npm ci
          npm run build
      - name: Install, update, and launch on Windows and macOS
        if: runner.os != 'Linux'
        timeout-minutes: 10
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml official_chataigne_platform_smoke -- --ignored --nocapture
      - name: Install, update, and launch in a Linux desktop session
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --locked --manifest-path src-tauri/Cargo.toml official_chataigne_platform_smoke -- --ignored --nocapture
