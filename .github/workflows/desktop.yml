name: Desktop packages

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_VERSION: "1.95.0"
  NODE_VERSION: "24"

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}
      - name: Check frontend
        run: |
          npm ci
          npm run check
          npm run build
      - name: Test desktop backend
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Bundle Golden Launcher
        env:
          APPLE_SIGNING_IDENTITY: "-"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri -- build --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: golden-launcher-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  raspberry-pi:
    name: Raspberry Pi OS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            deb_arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            target: aarch64-unknown-linux-gnu
          - arch: armhf
            deb_arch: armhf
            runner: ubuntu-24.04
            platform: linux/arm/v7
            target: armv7-unknown-linux-gnueabihf
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'armhf'
        with:
          platforms: arm
      - uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/golden-arm/cargo
            src-tauri/target
          key: golden-bookworm-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Build and inspect the Debian package on Bookworm
        env:
          PLATFORM: ${{ matrix.platform }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/golden-arm/cargo"
          docker run --rm --platform "$PLATFORM" \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -v "$RUNNER_TEMP/golden-arm/cargo:/opt/golden-cargo" \
            -e CARGO_HOME=/opt/golden-cargo -e CARGO_BUILD_JOBS=2 \
            -e TARGET -e DEB_ARCH -e RUST_VERSION -e CI \
            -e DEBIAN_FRONTEND=noninteractive node:22-bookworm bash -euo pipefail -c '
              apt-get -o Acquire::Retries=3 update
              apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev
              curl --proto "=https" --tlsv1.2 -fsSL https://sh.rustup.rs |
                sh -s -- -y --profile minimal --default-host "$TARGET" --default-toolchain "$RUST_VERSION" --no-modify-path
              export PATH="$CARGO_HOME/bin:$PATH"
              npm ci
              npm run tauri -- build --ci --target "$TARGET" --bundles deb -- --locked
              for package in src-tauri/target/"$TARGET"/release/bundle/deb/*.deb; do
                test "$(dpkg-deb -f "$package" Architecture)" = "$DEB_ARCH"
              done
            '
      - uses: actions/upload-artifact@v7
        with:
          name: golden-launcher-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
