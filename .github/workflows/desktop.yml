name: Desktop packages

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
    inputs:
      arm_runtime_smoke:
        description: Exercise official Chataigne packages on ARM Debian
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_VERSION: "1.95.0"
  NODE_VERSION: "24"

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}
      - name: Check frontend
        run: |
          npm ci
          npm run check
          npm run build
      - name: Test desktop backend
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Bundle Golden Launcher
        env:
          APPLE_SIGNING_IDENTITY: "-"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri -- build --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: golden-launcher-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  raspberry-pi:
    name: Raspberry Pi OS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      GOLDEN_ARM_RUNTIME_SMOKE: "${{ inputs.arm_runtime_smoke && 'true' || 'false' }}"
      QEMU_IMAGE: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            deb_arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux/arm64
          - arch: armhf
            deb_arch: armhf
            runner: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'armhf'
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm
      - uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/golden-arm/cargo
            src-tauri/target
          key: golden-bookworm-${{ matrix.arch == 'armhf' && 'cross-' || '' }}${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Prepare the ARMv7 Bookworm sysroot
        if: matrix.arch == 'armhf'
        run: |
          sysroot="$RUNNER_TEMP/armhf-sysroot"
          mkdir -p "$sysroot"
          docker run --name golden-armhf-sysroot --platform linux/arm/v7 -e DEBIAN_FRONTEND=noninteractive debian:bookworm bash -euc '
            apt-get -o Acquire::Retries=3 update
            apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev
          '
          docker export golden-armhf-sysroot | tar --no-same-owner -x -C "$sysroot"
          # Keep absolute library links inside the exported root.
          find "$sysroot/usr/lib/arm-linux-gnueabihf" -type l -lname '/*' -print0 |
            while IFS= read -r -d '' link; do
              target="$(readlink "$link")"
              ln -sfn "$(realpath -sm --relative-to="$(dirname "$link")" "$sysroot$target")" "$link"
            done
          test -f "$sysroot/usr/lib/arm-linux-gnueabihf/libdbus-1.so"
      - name: Cross-compile the armhf Debian package
        if: matrix.arch == 'armhf'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/golden-arm/cargo"
          docker run --rm --platform linux/amd64 -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -v "$RUNNER_TEMP/armhf-sysroot:/opt/armhf-sysroot:ro" \
            -v "$RUNNER_TEMP/golden-arm/cargo:/opt/golden-cargo" \
            -e CARGO_HOME=/opt/golden-cargo -e RUST_VERSION -e CI -e TARGET -e GOLDEN_ARM_RUNTIME_SMOKE \
            -e DEBIAN_FRONTEND=noninteractive node:22-bookworm bash -euo pipefail -c '
              apt-get -o Acquire::Retries=3 update
              apt-get install -y --no-install-recommends crossbuild-essential-armhf pkg-config
              curl --proto "=https" --tlsv1.2 -fsSL https://sh.rustup.rs |
                sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION" --target "$TARGET" --no-modify-path
              export PATH="$CARGO_HOME/bin:$PATH"
              export PKG_CONFIG_ALLOW_CROSS=1
              export PKG_CONFIG_SYSROOT_DIR=/opt/armhf-sysroot
              export PKG_CONFIG_LIBDIR="$PKG_CONFIG_SYSROOT_DIR/usr/lib/arm-linux-gnueabihf/pkgconfig:$PKG_CONFIG_SYSROOT_DIR/usr/share/pkgconfig"
              printf "%s\n" "#!/bin/sh" "exec arm-linux-gnueabihf-gcc --sysroot=/opt/armhf-sysroot -Wl,-rpath-link,/opt/armhf-sysroot/usr/lib/arm-linux-gnueabihf \"\$@\"" > /tmp/link-armhf
              chmod +x /tmp/link-armhf
              export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=/tmp/link-armhf
              npm ci
              npm run tauri -- build --ci --target "$TARGET" --bundles deb -- --locked
              if [ "$GOLDEN_ARM_RUNTIME_SMOKE" = true ]; then
                bash .github/scripts/build-arm-smoke.sh "$TARGET"
              fi
            '
      - name: Build the aarch64 Debian package on Bookworm
        if: matrix.arch == 'aarch64'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/golden-arm/cargo"
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -v "$RUNNER_TEMP/golden-arm/cargo:/opt/golden-cargo" \
            -e CARGO_HOME=/opt/golden-cargo -e CARGO_BUILD_JOBS=2 \
            -e TARGET -e RUST_VERSION -e CI -e GOLDEN_ARM_RUNTIME_SMOKE \
            -e DEBIAN_FRONTEND=noninteractive node:22-bookworm bash -euo pipefail -c '
              apt-get -o Acquire::Retries=3 update
              apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev
              curl --proto "=https" --tlsv1.2 -fsSL https://sh.rustup.rs |
                sh -s -- -y --profile minimal --default-host "$TARGET" --default-toolchain "$RUST_VERSION" --no-modify-path
              export PATH="$CARGO_HOME/bin:$PATH"
              npm ci
              npm run tauri -- build --ci --target "$TARGET" --bundles deb -- --locked
              if [ "$GOLDEN_ARM_RUNTIME_SMOKE" = true ]; then
                bash .github/scripts/build-arm-smoke.sh "$TARGET"
              fi
            '
      - name: Check the Debian package architecture
        env:
          TARGET: ${{ matrix.target }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          for package in src-tauri/target/"$TARGET"/release/bundle/deb/*.deb; do
            test "$(dpkg-deb -f "$package" Architecture)" = "$DEB_ARCH"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: golden-launcher-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
      - name: Register ARM AppImages with the runner's QEMU interpreter
        if: inputs.arm_runtime_smoke && matrix.arch == 'armhf'
        run: |
          emulator="$(docker create "$QEMU_IMAGE")"
          trap 'docker rm "$emulator" >/dev/null' EXIT
          docker cp "$emulator:/usr/bin/qemu-arm" "$RUNNER_TEMP/qemu-arm"
          # Type 2 AppImages put AI\x02 in ELF padding bytes matched by the ordinary QEMU rule.
          magic='\x7f\x45\x4c\x46\x01\x01\x01\x00\x41\x49\x02\x00\x00\x00\x00\x00\x02\x00\x28\x00'
          mask='\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff'
          printf '%s\n' ":qemu-arm-appimage:M::$magic:$mask:$RUNNER_TEMP/qemu-arm:POCF" |
            sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null
      - name: Exercise the package and publisher runtime on ARM Debian
        if: inputs.arm_runtime_smoke
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            -e TARGET -e GOLDEN_DISPOSABLE_SMOKE=1 -e DEBIAN_FRONTEND=noninteractive \
            debian:bookworm bash -euo pipefail -c '
              build="/workspace/src-tauri/target/$TARGET/release"
              packages=("$build"/bundle/deb/*.deb)
              test "${#packages[@]}" = 1
              test -f "${packages[0]}"
              apt-get -o Acquire::Retries=3 update
              apt-get install -y --no-install-recommends "${packages[0]}" xvfb xauth libcurl4 libgcrypt20 libsystemd0 libjack-jackd2-0 libpipewire-0.3-0 libpulse0 libgl1-mesa-dri
              test -x /usr/bin/golden-launcher
              xvfb-run -a "$build/publisher-smoke" official_chataigne_platform_smoke --ignored --nocapture
            '
