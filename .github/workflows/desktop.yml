name: Desktop packages

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_VERSION: "1.95.0"
  NODE_VERSION: "24"

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}
      - name: Check frontend
        run: |
          npm ci
          npm run check
          npm run build
      - name: Test desktop backend
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Bundle Golden Launcher
        env:
          APPLE_SIGNING_IDENTITY: "-"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri -- build --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: golden-launcher-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  raspberry-pi:
    name: Raspberry Pi OS ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    container: debian:bookworm
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            deb_arch: arm64
            triplet: aarch64-linux-gnu
            target: aarch64-unknown-linux-gnu
          - arch: armhf
            deb_arch: armhf
            triplet: arm-linux-gnueabihf
            target: armv7-unknown-linux-gnueabihf
    steps:
      - name: Install Debian cross-build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          dpkg --add-architecture "$DEB_ARCH"
          apt-get -o Acquire::Retries=3 update
          apt-get install -y --no-install-recommends ca-certificates curl git file pkg-config dpkg-dev \
            "crossbuild-essential-$DEB_ARCH" "libwebkit2gtk-4.1-dev:$DEB_ARCH" "libgtk-3-dev:$DEB_ARCH" \
            "libayatana-appindicator3-dev:$DEB_ARCH" "libdbus-1-dev:$DEB_ARCH" "librsvg2-dev:$DEB_ARCH"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}
      - name: Build and inspect the Debian package
        env:
          TRIPLET: ${{ matrix.triplet }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          TARGET: ${{ matrix.target }}
        run: |
          npm ci
          linker="CARGO_TARGET_${TARGET^^}_LINKER"
          export "${linker//-/_}=$TRIPLET-gcc"
          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_LIBDIR="/usr/lib/$TRIPLET/pkgconfig:/usr/share/pkgconfig"
          npm run tauri -- build --ci --target "$TARGET" --bundles deb -- --locked
          for package in src-tauri/target/"$TARGET"/release/bundle/deb/*.deb; do
            test "$(dpkg-deb -f "$package" Architecture)" = "$DEB_ARCH"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: golden-launcher-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
