[package]
name = "golden-launcher"
version = "0.1.3"
edition = "2024"
description = "Desktop library for Golden apps"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2.14.1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util"] }
tokio-util = "0.7"

[target.'cfg(windows)'.dependencies]
pelite = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }
winreg = "0.56"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
plist = "1"
roxmltree = "0.21"
trash = { version = "5.4", default-features = false }
walkdir = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.9"
